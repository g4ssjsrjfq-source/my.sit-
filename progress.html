<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeQuest | Прогресс</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="cssstyle.css">
</head>
<body>
    <div class="wrapper">
        <nav class="navbar">
            <div class="logo"><i class="fas fa-code"></i> CodeQuest</div>
            <div class="nav-links">
                <a href="index.html"><i class="fas fa-laptop-code"></i> Практика</a>
                <a href="quiz.html"><i class="fas fa-question-circle"></i> Тесты</a>
                <a href="progress.html" class="active"><i class="fas fa-chart-line"></i> Прогресс</a>
                <a href="settings.html"><i class="fas fa-sliders-h"></i> Настройки</a>
            </div>
            <div class="user-xp"><i class="fas fa-gem"></i> <span id="headerScore">0</span> XP</div>
        </nav>

        <main class="stats-container">
            <h2><i class="fas fa-chart-simple"></i> Ваша статистика</h2>
            <div class="stats-card">
                <div class="stat-row"><span><i class="fas fa-star"></i> Всего очков:</span> <strong id="totalScoreStat">0</strong></div>
                <div class="stat-row"><span><i class="fas fa-check-circle"></i> Пройдено практик:</span> <strong id="completedPractices">0</strong> / 3</div>
                <div class="stat-row"><span><i class="fas fa-question-circle"></i> Тестов решено:</span> <strong id="completedQuizzes">0</strong> / 3</div>
                <div class="progress-full"><div id="globalProgressBar" class="progress-fill-global" style="width:0%"></div></div>
                <button id="exportStatsBtn" class="btn-outline"><i class="fas fa-download"></i> Экспорт CSV</button>
            </div>
        </main>
    </div>
    <script src="js_main.js"></script>
</body>
</html>

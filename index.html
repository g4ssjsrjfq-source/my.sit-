<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CodeQuest | Практика</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="cssstyle.css">
</head>
<body>
    <div class="wrapper">
        <nav class="navbar">
            <div class="logo"><i class="fas fa-code"></i> CodeQuest</div>
            <div class="nav-links">
                <a href="index.html" class="active"><i class="fas fa-laptop-code"></i> Практика</a>
                <a href="quiz.html"><i class="fas fa-question-circle"></i> Тесты</a>
                <a href="progress.html"><i class="fas fa-chart-line"></i> Прогресс</a>
                <a href="settings.html"><i class="fas fa-sliders-h"></i> Настройки</a>
            </div>
            <div class="user-xp"><i class="fas fa-gem"></i> <span id="headerScore">0</span> XP</div>
        </nav>

        <main class="quest-layout">
            <aside class="info-panel">
                <div class="story-block">
                    <h3><i class="fas fa-scroll"></i> Сюжет</h3>
                    <p id="storyTxt">Вирус "Null" атакует сервер. Напишите код, чтобы отразить атаку.</p>
                </div>
                <div class="task-block">
                    <h3><i class="fas fa-tasks"></i> Задание</h3>
                    <h4 id="taskTitle">Переменная</h4>
                    <p id="taskDesc">Создайте переменную name = "Герой" и выведите её.</p>
                    <div class="hint"><i class="fas fa-lightbulb"></i> <span id="hintText">let name = "Герой"; console.log(name);</span></div>
                </div>
            </aside>

            <section class="work-area">
                <div class="code-header">
                    <span><i class="fab fa-js"></i> Редактор кода</span>
                    <button id="runBtn" class="btn-outline"><i class="fas fa-play"></i> Запуск</button>
                </div>
                <textarea id="codeInput" placeholder="Напишите ваш код..."></textarea>
                
                <div class="console-box">
                    <span><i class="fas fa-terminal"></i> Вывод:</span>
                    <pre id="consoleOut">> Готов к бою</pre>
                </div>

                <div class="action-bar">
                    <button id="checkBtn" class="btn-primary"><i class="fas fa-shield-alt"></i> Проверить</button>
                    <button id="nextBtn" class="btn-success" disabled><i class="fas fa-arrow-right"></i> Далее</button>
                </div>
            </section>
        </main>
    </div>
    <script src="js_main.js"></script>
</body>
</html>
